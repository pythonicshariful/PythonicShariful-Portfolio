{% extends "admin/base.html" %}
{% block title %}Skills — Admin{% endblock %}
{% block page_title %}Skills{% endblock %}
{% block content %}
<div class="panel">
  <h2>Add skill</h2>
  <form class="form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="field"><label for="name">Name *</label><input type="text" id="name" name="name" required placeholder="e.g. FastAPI"></div>
      <div class="field"><label for="category">Category</label><input type="text" id="category" name="category" value="Core"></div>
      <div class="field"><label for="level">Level (0–100)</label><input type="number" id="level" name="level" min="0" max="100" value="80"></div>
    </div>
    <button class="btn btn-primary" type="submit">Add Skill</button>
  </form>
</div>
<div class="table-wrap">
<table class="admin-table">
  <thead><tr><th>Name</th><th>Category</th><th>Level</th><th>Actions</th></tr></thead>
  <tbody>
  {% for s in skills %}
  <tr>
    <td data-label="Name"><strong>{{ s.name }}</strong></td>
    <td data-label="Category">{{ s.category }}</td>
    <td data-label="Level">{{ s.level }}%</td>
    <td data-label="Actions" class="actions">
      <form method="post" action="{{ url_for('admin_skill_delete', skid=s.id) }}" data-confirm="Delete skill '{{ s.name }}'?">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-small btn-danger" type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
